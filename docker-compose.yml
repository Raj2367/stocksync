version: "3.8"

services:
  # ==================== INFRASTRUCTURE ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stocksync-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - stocksync-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stocksync-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # CRITICAL FIX: Two listeners — one for Docker-internal, one for host access
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-broker-api-versions",
          "--bootstrap-server",
          "kafka:29092",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - stocksync-network

  postgres:
    image: postgres:15-alpine
    container_name: stocksync-postgres
    environment:
      POSTGRES_USER: stocksync
      POSTGRES_PASSWORD: stocksync
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksync -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - stocksync-network

  mongodb:
    image: mongo:7
    container_name: stocksync-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - stocksync-network

  redis:
    image: redis:7-alpine
    container_name: stocksync-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stocksync-network

  # ==================== APPLICATION SERVICES ====================

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: stocksync-order-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/orders
      - KAFKA_BROKER=kafka:29092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/order-service:/app
      - /app/node_modules
      - /app/dist
    networks:
      - stocksync-network
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:

networks:
  stocksync-network:
    driver: bridge
