services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: stocksync-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=${API_GATEWAY_PORT}
      - JWT_SECRET=${API_GATEWAY_JWT_SECRET}
      - MONGO_URI=${API_GATEWAY_MONGO_URI}
      - REDIS_URL=${REDIS_URL}
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL}
      - SAGA_SERVICE_URL=${SAGA_SERVICE_URL}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - SEED_ACME_ADMIN_PASSWORD=${SEED_ACME_ADMIN_PASSWORD}
      - SEED_ACME_USER_PASSWORD=${SEED_ACME_USER_PASSWORD}
      - SEED_BETA_ADMIN_PASSWORD=${SEED_BETA_ADMIN_PASSWORD}
      - SEED_BETA_USER_PASSWORD=${SEED_BETA_USER_PASSWORD}
    networks:
      - stocksync-production
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: stocksync-order-service
    environment:
      - NODE_ENV=production
      - PORT=${ORDER_SERVICE_PORT}
      - MONGO_URI=${ORDER_MONGO_URI}
      - KAFKA_BROKER=${KAFKA_BROKER}
    networks:
      - stocksync-production
    restart: unless-stopped

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: stocksync-inventory-service
    environment:
      - NODE_ENV=production
      - PORT=${INVENTORY_SERVICE_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - REDIS_URL=${REDIS_URL}
    networks:
      - stocksync-production
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: stocksync-payment-service
    environment:
      - NODE_ENV=production
      - PORT=${PAYMENT_SERVICE_PORT}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - DEMO_MODE=${DEMO_MODE}
    networks:
      - stocksync-production
    restart: unless-stopped

  saga-orchestrator:
    build:
      context: ./services/saga-orchestrator
      dockerfile: Dockerfile
    container_name: stocksync-saga-orchestrator
    environment:
      - NODE_ENV=production
      - PORT=${SAGA_SERVICE_PORT}
      - MONGO_URI=${SAGA_MONGO_URI}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL}
    networks:
      - stocksync-production
    restart: unless-stopped

networks:
  stocksync-production:
    driver: bridge
